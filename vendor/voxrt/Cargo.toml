[workspace]
resolver = "2"
# Local patch (2026-11-23): only the library is vendored, so the workspace lists
# only it. The upstream file also names voxrt-cli, voxrt-ffi and bindings/python;
# those directories are not shipped here, and tools that walk nested workspaces
# (cargo fmt, cargo metadata) failed on the missing manifests.
members = ["crates/voxrt"]
default-members = ["crates/voxrt"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89" # AVX-512 intrinsics (x86 VNNI kernel)

[workspace.dependencies]
half = "2"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# no rustfft SIMD: its AVX/SSE/NEON paths round differently, and the FFT is a small share of the front end
realfft = { version = "3", default-features = false }
libm = "0.2"
rayon = "1"
thiserror = "2"
anyhow = "1"
criterion = { version = "0.5", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
